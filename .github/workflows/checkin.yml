name: WorkBuddy Daily Check-in

on:
  schedule:
    # 每天北京时间 07:10 和 11:25（对应 UTC 前一天 23:10、当日 03:25）
    - cron: '10 23 * * *'
    - cron: '25 3 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键运行

jobs:
  run-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Check-in Script
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_UID: ${{ secrets.WB_UID }}
        run: |
          python checkin.py
